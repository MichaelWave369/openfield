name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgres://openfield:openfield@localhost:5432/openfield
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: openfield
          POSTGRES_USER: openfield
          POSTGRES_PASSWORD: openfield
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openfield -d openfield"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Validate database migrations
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f infra/postgres/init/001_evidence_spine.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f infra/postgres/init/002_operational_trust.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f infra/postgres/init/003_mission_operations.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "select PostGIS_Version();"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "select count(*) from openfield.records;"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "select count(*) from openfield.signing_key_registrations;"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "select count(*) from openfield.privacy_directives;"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "select count(*) from openfield.connector_executions;"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "select count(*) from openfield.mission_watchlist;"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "select count(*) from openfield.review_items;"
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
