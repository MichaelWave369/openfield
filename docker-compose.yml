services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: openfield
      POSTGRES_USER: openfield
      POSTGRES_PASSWORD: openfield
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openfield -d openfield"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - openfield-postgres:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro

volumes:
  openfield-postgres:
